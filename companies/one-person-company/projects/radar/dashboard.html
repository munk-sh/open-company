    body {

    .topbar {

      gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px;
    }
    .topbar-title { display: flex; align-items: center; gap: 10px; }
    .topbar-title h1 { font-size: 16px; font-weight: 600; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid transparent;
    }
    .badge--emerald { background: var(--accent-emerald-bg); color: #34d399; border-color: rgba(16,185,129,0.28); }
    .badge--amber { background: var(--accent-amber-bg); color: #fbbf24; border-color: rgba(245,158,11,0.28); }
    .badge--rose { background: var(--accent-rose-bg); color: #fb7185; border-color: rgba(244,63,94,0.28); }
    .badge--indigo { background: var(--accent-indigo-bg); color: #818cf8; border-color: rgba(99,102,241,0.28); }
    .quick-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-btn {
      background: var(--bg-surface); color: var(--text-secondary); border: 1px solid var(--border-subtle);
      border-radius: 6px; padding: 4px 9px; font-size: 11.5px; cursor: pointer; transition: all 0.15s ease;
    }
    .chip-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-strong); }
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 10px; margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
    }
    .kpi-label { color: var(--text-secondary); font-size: 11.5px; display: flex; justify-content: space-between; }
    .kpi-val { font-size: 20px; font-weight: 700; }
    .kpi-sub { color: var(--text-muted); font-size: 11px; display: flex; justify-content: space-between; }
    .tabs {
      display: flex; gap: 6px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px; overflow-x: auto;
    }
    .tab-btn {
      background: transparent; color: var(--text-secondary); border: none; border-bottom: 2px solid transparent;
      padding: 8px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--accent-indigo); background: rgba(99,102,241,0.06); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .panel {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 14px;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .panel-title { font-size: 13.5px; font-weight: 600; }
    .signal-list { display: flex; flex-direction: column; gap: 10px; }
    .signal-card {
      background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px 14px;
    }
    .signal-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .signal-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
    .signal-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px;
      margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); font-size: 12px;
    }
    .signal-box-label { color: var(--text-muted); font-size: 11px; margin-bottom: 2px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); }
    td { padding: 9px 10px; border-bottom: 1px solid rgba(31,39,55,0.55); vertical-align: middle; }
    .kw-wrap { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  </style>
</head>

          </div>
        `)
        .join("");

      const pf = data.profile || {};
      document.getElementById("profile-box").innerHTML =
        `<strong>核心赛道：</strong>${pf.niche || ""} &nbsp;|&nbsp; <strong>目标受众：</strong>${pf.target_audience || ""}`;
      document.getElementById("boost-kw").innerHTML = ((data.keywords && data.keywords.boost) || [])
        .map((k) => `<span class="badge badge--emerald">${k}</span>`)
        .join("");
      document.getElementById("mute-kw").innerHTML = ((data.keywords && data.keywords.mute) || [])
        .map((k) => `<span class="badge badge--rose">${k}</span>`)
        .join("");

      const pubRows = (data.publicSources || []).map((s) => `
        <tr>
          <td><strong>${s.name}</strong></td>
          <td><span class="badge badge--indigo">公开源 (${s.type})</span></td>
          <td class="num">${s.url || `min_score: ${s.min_score}, limit: ${s.limit}`}</td>
          <td>${s.enabled !== false ? `<span class="badge badge--emerald">启用中</span>` : `<span class="badge badge--amber">已停用</span>`}</td>
        </tr>
      `);
      const socRows = (data.socialChannels || []).map((s) => `
        <tr>
          <td><strong>${s.platform}</strong></td>
          <td><span class="badge badge--amber">社媒浏览器 (browse)</span></td>
          <td style="color:var(--text-secondary)">${(s.search_queries || []).join(" | ")}</td>
          <td>${s.enabled !== false ? `<span class="badge badge--emerald">启用中</span>` : `<span class="badge badge--amber">按需开启</span>`}</td>
        </tr>
      `);
      document.getElementById("sources-tbody").innerHTML = pubRows.concat(socRows).join("");
    }

    function filterSignals(tier) {
      const list = (window.__PUBLIC_SIGNALS__ || []).filter((s) => tier === "all" || s.tier === tier);
      document.getElementById("public-signals-list").innerHTML = list
        .map((s) => {
          const badge =
            s.tier === "S"
              ? `<span class="badge badge--rose">🔴 S级 · 立即行动</span>`
              : s.tier === "A"
                ? `<span class="badge badge--amber">🟡 A级 · 重点关注</span>`
                : `<span class="badge badge--indigo">🔵 B级 · 认知储备</span>`;
          return `
            <div class="signal-card">
              <div class="signal-top">
                <span class="signal-title">[${s.id}] ${s.title}</span>
                <div>${badge} <span class="badge badge--indigo">${s.source}</span></div>
              </div>
              <div class="signal-grid">
                <div>
                  <div class="signal-box-label">1. 发生了什么 (What Happened)</div>
                  <div style="color:var(--text-secondary)">${s.whatHappened}</div>
                </div>
                <div>
                  <div class="signal-box-label">2. 为什么重要 (Why It Matters)</div>
                  <div style="color:var(--text-secondary)">${s.whyItMatters}</div>
                </div>
                <div>
                  <div class="signal-box-label">3. 下游怎么用 (${s.downstreamTarget})</div>
                  <div>${s.actionProposal} <button class="chip-btn" style="margin-left:6px;" onclick="openProjectFile('${s.detailPath}')">查看档案</button></div>
                </div>
              </div>
            </div>
          `;
        })
        .join("");
    }

    renderAll();
  </script>
</body>
</html>
