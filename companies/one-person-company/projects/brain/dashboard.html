  <style>
    :root {
      --bg-canvas: #0a0c10;
      --bg-surface: #11151e;
      --bg-elevated: #171c28;
      --bg-hover: #1e2536;
      --border-subtle: #1f2737;
      --border-strong: #2d384f;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-emerald: #10b981;
      --accent-emerald-bg: rgba(16, 185, 129, 0.12);
      --accent-amber: #f59e0b;
      --accent-amber-bg: rgba(245, 158, 11, 0.12);
      --accent-rose: #f43f5e;
      --accent-rose-bg: rgba(244, 63, 94, 0.12);
      --accent-indigo: #6366f1;
      --accent-indigo-bg: rgba(99, 102, 241, 0.14);
      --radius: 10px;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Inter", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-canvas); color: var(--text-primary); font-family: var(--font-sans);
      font-size: 13px; line-height: 1.5; padding: 18px 20px 32px; -webkit-font-smoothing: antialiased;
    }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .topbar {
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
      gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px;
    }
    .topbar-title { display: flex; align-items: center; gap: 10px; }
    .topbar-title h1 { font-size: 16px; font-weight: 600; }
    .badge {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
      border-radius: 999px; font-size: 11px; font-weight: 500; border: 1px solid transparent;
    }
    .badge--emerald { background: var(--accent-emerald-bg); color: #34d399; border-color: rgba(16,185,129,0.28); }
    .badge--amber { background: var(--accent-amber-bg); color: #fbbf24; border-color: rgba(245,158,11,0.28); }
    .badge--rose { background: var(--accent-rose-bg); color: #fb7185; border-color: rgba(244,63,94,0.28); }
    .badge--indigo { background: var(--accent-indigo-bg); color: #818cf8; border-color: rgba(99,102,241,0.28); }
    .quick-links { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-btn {
      background: var(--bg-surface); color: var(--text-secondary); border: 1px solid var(--border-subtle);
      border-radius: 6px; padding: 4px 9px; font-size: 11.5px; cursor: pointer; transition: all 0.15s ease;
    }
    .chip-btn:hover { background: var(--bg-hover); color: var(--text-primary); border-color: var(--border-strong); }
    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 10px; margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius);
      padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
    }
    .kpi-label { color: var(--text-secondary); font-size: 11.5px; display: flex; justify-content: space-between; }
    .kpi-val { font-size: 20px; font-weight: 700; }
    .kpi-sub { color: var(--text-muted); font-size: 11px; display: flex; justify-content: space-between; }
    .tabs {
      display: flex; gap: 6px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 16px; overflow-x: auto;
    }
    .tab-btn {
      background: transparent; color: var(--text-secondary); border: none; border-bottom: 2px solid transparent;
      padding: 8px 12px; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap;
    }
    .tab-btn.active { color: var(--text-primary); border-bottom-color: var(--accent-indigo); background: rgba(99,102,241,0.06); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }
    .panel {
      background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 14px;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .panel-title { font-size: 13.5px; font-weight: 600; }
    .cards-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px;
    }
    .item-card {
      background: var(--bg-elevated); border: 1px solid var(--border-subtle); border-radius: 8px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 8px; justify-content: space-between;
    }
    .item-title { font-size: 13.5px; font-weight: 600; color: var(--text-primary); }
  </style>
</head>

  <header class="topbar">
    <div class="topbar-title">
      <h1>🧠 第二大脑 · 常青认知卡与火花池看板</h1>
      <span class="badge badge--emerald" id="inbox-zero-badge">Inbox Zero</span>
    </div>
    <div class="quick-links">
      <button class="chip-btn" onclick="openProjectFile('sparks.md')">⚡ 待引爆火花池 (sparks.md)</button>
      <button class="chip-btn" onclick="openProjectFile('topics/_index.md')">🗂️ 常青卡总索引 (_index.md)</button>
      <button class="chip-btn" onclick="openProjectFile('principles.md')">🧭 个人核心认知宪法</button>
      <button class="chip-btn" onclick="openProjectFile('inbox/README.md')">📥 投喂箱说明</button>
    </div>
  </header>

  <section class="kpi-grid" id="kpi-grid"></section>

  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab('sparks', this)">⚡ 待引爆火花池 (Studio & Wealth)</button>
    <button class="tab-btn" onclick="switchTab('topics', this)">🌲 常青认知卡片墙 (Topics)</button>
    <button class="tab-btn" onclick="switchTab('principles', this)">🧭 个人核心判断与认知宪法</button>
  </nav>

  <div id="tab-sparks" class="tab-pane active">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">⚡ 外部高优情报 × 个人原话碰撞出的待执行火花</span>
        <div class="quick-links">
          <button class="chip-btn" onclick="filterSparks('all')">全部</button>
          <button class="chip-btn" onclick="filterSparks('studio')">✍️ Studio 选题火花</button>
          <button class="chip-btn" onclick="filterSparks('wealth')">💰 Wealth 搞钱火花</button>
        </div>
      </div>
      <div class="cards-grid" id="sparks-grid"></div>
    </div>
  </div>

  <div id="tab-topics" class="tab-pane">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">🌲 按领域命题持续生长的常青认知卡（拒绝死摘要堆砌）</span>
        <button class="chip-btn" onclick="openProjectFile('topics/_index.md')">查看 _index.md</button>
      </div>
      <div class="cards-grid" id="topics-grid"></div>
    </div>
  </div>

  <div id="tab-principles" class="tab-pane">
    <div class="panel">
      <div class="panel-head">
        <span class="panel-title">🧭 全公司选题与商业算账的最高过滤网 (principles.md)</span>
        <button class="chip-btn" onclick="openProjectFile('principles.md')">打开完整 principles.md</button>
      </div>
      <div class="cards-grid" id="principles-grid"></div>
    </div>
  </div>

  <script>
    function openProjectFile(path) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "munk:ops-select-path", path }, "*");
      }
    }

    function switchTab(id, btn) {
      document.querySelectorAll(".tab-pane").forEach((el) => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach((el) => el.classList.remove("active"));
      document.getElementById("tab-" + id)?.classList.add("active");
      btn?.classList.add("active");
    }

    function renderAll() {
      const data = window.__DASHBOARD_DATA__ || {};
      const st = data.stats || {};

      document.getElementById("inbox-zero-badge").textContent =
        st.inboxPendingCount > 0 ? `📥 待消化 ${st.inboxPendingCount} 篇` : "✨ Inbox Zero";

      document.getElementById("kpi-grid").innerHTML = `
        <div class="kpi-card">
          <div class="kpi-label"><span>常青认知卡 (Topics)</span><span class="badge badge--indigo">复利弹药</span></div>
          <div class="kpi-val num">${st.topicsCount ?? 0} <span style="font-size:13px;font-weight:500;">张</span></div>
          <div class="kpi-sub"><span>按命题持续生长</span><span>供 studio/wealth 检索</span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label"><span>待写内容火花 (For Studio)</span><span class="badge badge--emerald">原创选题</span></div>
          <div class="kpi-val num">${st.studioSparksCount ?? 0} <span style="font-size:13px;font-weight:500;">个</span></div>
          <div class="kpi-sub"><span>含立意与反面论据</span><span>由 topic-pitch 认领</span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label"><span>待验搞钱火花 (For Wealth)</span><span class="badge badge--amber">48h验证</span></div>
          <div class="kpi-val num">${st.wealthSparksCount ?? 0} <span style="font-size:13px;font-weight:500;">个</span></div>
          <div class="kpi-sub"><span>高痛感变现切口</span><span>由 deal-and-quote 尽调</span></div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label"><span>核心认知与商业铁律</span><span class="badge badge--rose">最高宪法</span></div>
          <div class="kpi-val num">${st.principlesCount ?? 0} <span style="font-size:13px;font-weight:500;">条</span></div>
          <div class="kpi-sub"><span>投喂箱待处理: ${st.inboxPendingCount ?? 0}</span><span>每周日自动复盘进化</span></div>
        </div>
      `;

      window.__ALL_SPARKS__ = data.sparks || [];
      filterSparks("all");

      document.getElementById("topics-grid").innerHTML = (data.topics || [])
        .map((t) => `
          <div class="item-card">
            <div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <span class="item-title">${t.title}</span>
                <span class="badge badge--indigo">${t.evidenceCount} 组实证</span>
              </div>
              <p style="color:var(--text-secondary);font-size:12px;">${t.coreThesis}</p>
            </div>
            <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05);">
              <span class="num" style="color:var(--text-muted);font-size:11px;">${t.path}</span>
              <button class="chip-btn" onclick="openProjectFile('${t.path}')">打开认知卡</button>
            </div>
          </div>
        `)
        .join("");

      document.getElementById("principles-grid").innerHTML = (data.principles || [])
        .map((p) => `
          <div class="item-card">
            <div class="item-title">铁律 #${p.index}：${p.title}</div>
            <div style="display:flex;justify-content:flex-end;">
              <button class="chip-btn" onclick="openProjectFile('principles.md')">查看条款细则</button>
            </div>
          </div>
        `)
        .join("");
    }

    function filterSparks(target) {
      const list = (window.__ALL_SPARKS__ || []).filter((s) => target === "all" || s.target === target);
      document.getElementById("sparks-grid").innerHTML = list
        .map((s) => {
          const badge =
            s.target === "wealth"
              ? `<span class="badge badge--amber">💰 For Wealth</span>`
              : `<span class="badge badge--emerald">✍️ For Studio</span>`;
          return `
            <div class="item-card">
              <div>
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                  <span class="item-title">[${s.id}] ${s.title}</span>
                  ${badge}
                </div>
                <p style="color:var(--text-secondary);font-size:12px;margin-bottom:6px;"><strong>切入逻辑：</strong>${s.angle}</p>
                <p style="color:var(--text-muted);font-size:11.5px;"><strong>支撑弹药：</strong>${s.evidence}</p>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05);">
                <span class="badge badge--indigo">${s.status}</span>
                <button class="chip-btn" onclick="openProjectFile('sparks.md')">查看火花池</button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    renderAll();
  </script>
</body>
